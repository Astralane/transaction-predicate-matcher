[package]
name = "transaction-predicate-matcher"
version = "0.2.0"
edition = "2021"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
solana-pubkey = "4.2"
arc-swap = "1"
rustc-hash = "2"
thiserror = "1"
# Zero-copy view over a serialized transaction. Kept on the same major line as solana-pubkey so the
# `Pubkey` type is shared with consumers; bumping one without the other yields two incompatible
# `Pubkey` types and a `SanitizedTransactionView` the consumer cannot pass in.
agave-transaction-view = { version = "=4.1.0-beta.1", features = ["agave-unstable-api"] }

[dev-dependencies]
serde_json = "1"
bincode = "1"
solana-signature = "3.4"
solana-message = { version = "=4.2.0", features = ["serde"] }
solana-transaction = { version = "=4.1.2", features = ["serde"] }
proptest = "1"
criterion = "0.5"

[[bench]]
name = "hotpath"
harness = false
